# User-editable categorization rules.
# Copy this file to category.toml and edit category.toml locally.
# Rules are evaluated in order, so earlier matches win.

[[rules]]
id = "paycheck_income"
category = "paycheck"
bucket = "income"
description_contains = ["PAYROLL"]
is_income = true

[[rules]]
id = "debit_coffee"
category = "coffee"
bucket = "wants"
accounts = ["debit_demo"]
description_contains = ["COFFEE"]

[[rules]]
id = "credit_health"
category = "dental"
bucket = "needs"
accounts = ["credit_demo"]
details = ["Health & Wellness"]

[[rules]]
id = "software_subscription"
category = "software_subscription"
bucket = "wants"
description_contains = ["SOFTWARE SUBSCRIPTION"]

[[rules]]
id = "credit_card_payment"
category = "credit_card_payment"
bucket = "transfers"
accounts = ["credit_demo"]
credit_card_payment = true

[[rules]]
id = "venmo_coaching"
category = "coaching"
bucket = "business"
accounts = ["venmo"]
description_contains = ["Coaching session"]
transaction_types = ["Charge"]

[[rules]]
id = "venmo_reimbursement"
category = "reimbursement"
bucket = "income"
accounts = ["venmo"]
venmo_reimbursement = true

[[rules]]
id = "internal_transfer"
category = "internal_transfer"
bucket = "transfers"
internal_transfer = true

[[rules]]
id = "debit_card_general"
category = "card"
bucket = "wants"
transaction_types = ["DEBIT_CARD"]

[[rules]]
id = "venmo_inflow_general"
category = "peer_in"
bucket = "transfers"
accounts = ["venmo"]
is_income = true
